name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "bc8a47ea-c1ac-4883-8740-6ce3d8876d1b"

[[kv_namespaces]]
binding = "kv"
id = "4fea99a246354fc3b78a59a9df3745f7"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["limadoree.online"]
admin = "admin@limadoree.online"
jwt_secret = "LimadoreeSecretMail202688"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
